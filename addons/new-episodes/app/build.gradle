plugins {
    id 'com.android.application'
}

android {
    namespace 'local.newepisodes'
    compileSdk 34

    defaultConfig {
        applicationId 'local.newepisodes'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: signed with this PC's debug key, like the launcher. The panel
            // provider only answers apps signed with the same key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No libraries in the APK. Test only: plain JVM tests in src/test, with the reference org.json in place of
    // android.jar's stubs.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
